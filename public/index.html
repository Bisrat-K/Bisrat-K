<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1222">
  <title>Nigat ንጋት</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="sun" aria-hidden="true"></span>
      <div>
        <h1>Nigat <span class="am">ንጋት</span></h1>
        <p id="clock" class="muted">—</p>
      </div>
    </div>
    <div class="streak" title="On-time wake-up streak">
      <strong id="streak">0</strong><span>day streak</span>
    </div>
  </header>

  <main>
    <section id="chat" class="chat" aria-live="polite"></section>

    <div id="interim" class="interim" hidden></div>

    <section class="controls">
      <div class="lang" role="radiogroup" aria-label="Speaking language">
        <button type="button" data-lang="am" role="radio">አማርኛ</button>
        <button type="button" data-lang="en" role="radio">English</button>
      </div>

      <button id="mic" class="mic" type="button" aria-label="Talk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>

      <label class="toggle" title="After Nigat answers, listen again automatically">
        <input type="checkbox" id="handsfree"> <span>Hands-free</span>
      </label>

      <form id="typeForm" class="type">
        <input id="typeInput" type="text" placeholder="Type instead… / እዚህ ይጻፉ…" autocomplete="off">
        <button type="submit">Send</button>
      </form>
      <p id="voiceNote" class="note" hidden></p>
    </section>

    <section class="panels">
      <details open>
        <summary>Today</summary>
        <div class="row"><span>Wake target</span><strong id="wakeTarget">—</strong></div>
        <div class="row"><span>Bedtime</span><strong id="bedtime">—</strong></div>
        <ul id="tasks" class="list"></ul>
      </details>
      <details>
        <summary>Alarms &amp; reminders</summary>
        <ul id="reminders" class="list"></ul>
        <button id="nightMode" type="button" class="secondary">Night mode (keep screen on for alarms)</button>
      </details>
      <details>
        <summary>Wake-up history</summary>
        <div id="wakeChart" class="wake-chart"></div>
      </details>
      <details>
        <summary>What Nigat knows about you</summary>
        <ul id="memories" class="list"></ul>
        <button id="clearHistory" type="button" class="secondary">Start a fresh conversation</button>
      </details>
    </section>
  </main>

  <!-- First-tap overlay: browsers need a tap before sound/voice can play. -->
  <div id="start" class="overlay">
    <div class="card">
      <span class="sun big" aria-hidden="true"></span>
      <h2>Good morning · እንደምን አደሩ</h2>
      <p>Tap to start. Allow the microphone and notifications so Nigat can hear you and wake you up.</p>
      <button id="startBtn" type="button">Start · ጀምር</button>
    </div>
  </div>

  <div id="alarm" class="overlay alarm" hidden>
    <div class="card">
      <p class="alarm-time" id="alarmTime"></p>
      <p id="alarmMsg" class="alarm-msg"></p>
      <button id="alarmUp" type="button">I'm up! · ተነስቻለሁ!</button>
      <button id="alarmSnooze" type="button" class="secondary">Snooze 5 min</button>
    </div>
  </div>

  <div id="passcode" class="overlay" hidden>
    <form class="card" id="passForm">
      <h2>Passcode</h2>
      <input id="passInput" type="password" placeholder="APP_PASSCODE" autocomplete="current-password">
      <button type="submit">Unlock</button>
    </form>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
